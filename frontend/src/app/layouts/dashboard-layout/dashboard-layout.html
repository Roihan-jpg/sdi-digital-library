<a class="skip-link" href="#main-content">Lewati ke konten utama</a>

<div class="shell" [class.shell--compact]="railCollapsed()">
  <button
    class="backdrop"
    type="button"
    tabindex="-1"
    aria-label="Tutup navigasi dashboard"
    [class.backdrop--visible]="navigationOpen()"
    (click)="closeNavigation(true)"
  ></button>

  <aside
    #drawer
    id="dashboard-navigation"
    aria-label="Panel navigasi dashboard"
    [class.drawer--open]="navigationOpen()"
    (keydown)="trapNavigationFocus($event)"
  >
    <div class="aside-heading">
      <a class="dashboard-brand" routerLink="/dashboard" (click)="closeNavigation()">
        <img src="/sdi_logo.png" width="46" height="46" alt="" />
        <span><strong>SDI Library</strong><small>Ruang kerja</small></span>
      </a>
      <button
        #drawerClose
        class="drawer-close"
        type="button"
        aria-label="Tutup navigasi dashboard"
        (click)="closeNavigation(true)"
      >
        <span aria-hidden="true">×</span>
      </button>
    </div>

    <div class="identity">
      <span class="identity__avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="identity__copy">
        <small>{{ roleLabel() }}</small>
        <strong>{{ authStore.displayName() }}</strong>
      </span>
    </div>

    <nav class="dashboard-nav" aria-label="Navigasi dashboard">
      @for (item of navigation(); track item.label) {
        <a
          [routerLink]="item.path"
          [fragment]="item.section ?? undefined"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{
            paths: 'exact',
            queryParams: 'ignored',
            matrixParams: 'ignored',
            fragment: 'exact',
          }"
          [attr.title]="railCollapsed() ? item.label : null"
          (click)="closeNavigation()"
        >
          <span class="nav-glyph" aria-hidden="true"><i></i><i></i></span>
          <span class="nav-label">{{ item.label }}</span>
          @if (item.badge) {
            <span class="menu-badge">{{ item.badge }}</span>
          }
        </a>
      }
    </nav>

    <div class="aside-actions">
      <button
        class="rail-toggle"
        type="button"
        [attr.aria-pressed]="railCollapsed()"
        [attr.aria-label]="railCollapsed() ? 'Perluas sidebar' : 'Ringkas sidebar'"
        (click)="toggleRail()"
      >
        <span class="rail-toggle__icon" aria-hidden="true">‹</span>
        <span class="nav-label">Ringkas sidebar</span>
      </button>
      <button class="logout" type="button" [disabled]="isLoggingOut()" (click)="logout()">
        <span class="logout-icon" aria-hidden="true">↗</span>
        <span class="nav-label">{{ isLoggingOut() ? 'Mengakhiri sesi…' : 'Keluar' }}</span>
      </button>
    </div>
  </aside>

  <section class="workspace">
    <header class="workspace-bar">
      <button
        #menuButton
        class="menu-button"
        type="button"
        aria-label="Buka navigasi dashboard"
        aria-controls="dashboard-navigation"
        [attr.aria-expanded]="navigationOpen()"
        (click)="openNavigation()"
      >
        <span></span><span></span>
      </button>
      <div>
        <small>{{ roleLabel() }}</small>
        <strong>Ruang kerja perpustakaan</strong>
      </div>
      <a class="public-link" routerLink="/">Lihat situs publik <span aria-hidden="true">↗</span></a>
    </header>

    <sdi-notification-banner />
    <main id="main-content" tabindex="-1"><router-outlet /></main>
  </section>
</div>
